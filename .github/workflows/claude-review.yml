name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [main]

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      # OPT-IN ONLY. This review never runs unless the PR carries the
      # `run-review` label — default is OFF, not "on unless skipped". A
      # forgotten label now costs nothing instead of triggering a paid run
      # against the owner's wishes (incident 2026-07-17: a `--label
      # skip-review` flag was simply omitted from `gh pr create`, and the
      # review ran anyway).
      #
      # Live label query, not `github.event.pull_request.labels`: a label
      # attached via `gh pr create --label` / `gh pr edit --add-label` lands
      # via a follow-up API call, after the triggering event's labels
      # snapshot was already captured — a static `if:` on the event context
      # would miss a label added at creation time. `labeled` is also in the
      # trigger types above so adding `run-review` to an already-open PR
      # fires this workflow and actually starts the review.
      - name: Check run-review label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json labels -q '.labels[].name' | grep -qx 'run-review'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Review
        if: steps.check.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.GHA_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the CVS (Composite Valuation Score) project
            conventions documented in CLAUDE.md. Focus on:

            - CVS model rules: weights/thresholds must come from config/cvs-weights.php,
              never hardcoded (FR-010); Quality Gate stays binary (CVSResult::failed(),
              never a numeric 0 score); CVS calculation must stay deterministic
              (no randomness, no date()/time() inside scoring logic).
            - Static analysis: declare(strict_types=1) and explicit type hints on new
              function boundaries; code should stay PHPStan level 6 clean.
            - Security: every POST route validates the CSRF token via
              $request->verifyCsrf(); protected controller actions call
              AuthController::requireAuth(); auth error messages stay generic
              (never reveal whether an e-mail exists).
            - AI/mail/scheduled-work conventions from CLAUDE.md: Claude API calls only
              through src/Ai/ with a request timeout and typed failure (never an
              exception bubbling to the page); outbound mail only through src/Mail/;
              new bin/ scripts log to their own file (never error_log()) and are
              idempotent.
            - General correctness, reuse, and simplification opportunities in the diff.

            Note: the PR branch is already checked out in the current working directory.

            Use `gh pr comment` to post a single top-level review comment with your
            findings, ranked most-severe first. Use
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            to highlight specific lines when useful. Only post GitHub comments - don't
            just print the review as a final message. If nothing significant is found,
            say so briefly instead of inventing issues.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
